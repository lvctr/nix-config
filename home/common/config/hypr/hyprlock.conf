general {
    disable_loading_bar = true
    ignore_empty_input = true
    hide_cursor = true
}

auth {
    fingerprint {
        enabled = true
        ready_message = Place fingerprint here. ↓ 󰈷
        present_message = Scanning... ↓ 󰈷
    }
}

background {
    monitor =
    color = rgb(002b36)
    blur_passes = 0
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $USER
    text_align = center
    color = rgb(839496)
    font_size = 25
    font_family = Source Han Code JP
    rotate = 0
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    text_align = center
    color = rgb(839496)
    font_size = 18
    font_family = Source Han Code JP
    rotate = 0
    position = -560, 40
    halign = right
    valign = bottom
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 1
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = 0
    outer_color = rgb(002b36)
    inner_color = rgb(586e75)
    font_color = rgb(002b36)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = 0
    check_color = rgb(2aa198)
    fail_color = rgb(dc322f)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    font_family = Source Han Code JP
    position = 0, -20
    halign = center
    valign = center
}