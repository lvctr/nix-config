# Shared Hyprland config: keybinds, window rules, exec-once - anything
# genuinely portable across rainlily/riverlily/waterlily.
#
# Deliberately does NOT contain `monitor=` lines - those are hardware facts
# and belong in each host's home/<name>.nix, which writes its own
# ~/.config/hypr/monitors.conf, sourced here.
source = ~/.config/hypr/monitors.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = fcitx5 -d
exec-once = hypridle

env = XCURSOR_THEME,Simp1e-Solarized-Dark
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,kde
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

# ---- your keybinds, window rules, workspace layout below ----
bind = SUPER, RETURN, exec, kitty
